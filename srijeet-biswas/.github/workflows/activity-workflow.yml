name: Update README Activity Feed

on:
  schedule:
    # Runs every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update README with latest activity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update README
        uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "activity"
          feed_list: "https://github.com/srijeet-biswas.atom"
          max_post_count: 5
          template: "$newline- $title"